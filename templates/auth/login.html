{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/modal_styles.css' %}">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div style="width: 100%; max-width: 460px; padding: 40px;">

        <h2 class="mb-4 text-center">Welcome back!</h2>

        <form method="post">
            {% csrf_token %}

            <div class="profile-info-card mb-3">
                <input type="text" name="username" placeholder="Username" class="auth-input" required>
            </div>
            <div class="profile-info-card mb-3">
                <input type="password" name="password" placeholder="Password" class="auth-input" required>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-dark btn-lg px-5">Login</button>
            </div>

            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
