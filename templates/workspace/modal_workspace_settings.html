<div class="modal fade" id="WorkspaceSettingsModal" tabindex="-1" aria-hidden="true">
   <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom_modal_shadow">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-gear"></i> Workspace settings</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form method="post" action="{% url 'workspace:workspace_settings' workspace.pk %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body p-4 d-flex flex-column gap-4">

                    {% if user_role == 'owner' or user_role == 'admin' %}
                    <div>
                        <p class="text-muted mb-2">Logo</p>
                        <div class="d-flex align-items-center gap-3">
                            {% if workspace.icon %}
                                <img src="{{ workspace.icon.url }}"
                                    style="width: 80px; height: 80px; border-radius: 12px; object-fit: cover;">
                            {% else %}
                                <i class="bi bi-people" style="font-size: 80px;"></i>
                            {% endif %}

                            <label class="btn btn-sm btn-outline-secondary" style="cursor: pointer; display: inline-block !important;">
                                <i class="bi bi-upload"></i> Upload logo
                                <input type="file" name="icon" accept="image/*" style="display: none;"
                                    onchange="this.form.submit()">
                            </label>
                        </div>
                    </div>

                    <div>
                        <p class="text-muted mb-2">Workspace name</p>
                        <input type="text" name="name" class="custom-search"
                               value="{{ workspace.name }}" placeholder="Name">
                    </div>
                    {% endif %}

                    <hr class="m-0">

                    <div class="d-flex flex-column gap-2">
                        {% if user_role == 'owner' %}
                            <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                                    data-bs-toggle="modal" data-bs-target="#OwnerLeaveModal">
                                <i class="bi bi-box-arrow-left"></i> Leave workspace
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger w-100"
                                    data-bs-toggle="modal" data-bs-target="#DeleteWorkspaceModal">
                                <i class="bi bi-trash"></i> Delete workspace
                            </button>
                        {% else %}
                            <button type="button" class="btn btn-sm btn-outline-secondary w-100"
                                    data-bs-toggle="modal" data-bs-target="#LeaveWorkspaceModal">
                                <i class="bi bi-box-arrow-left"></i> Leave workspace
                            </button>
                        {% endif %}
                    </div>
                </div>

                {% if user_role == 'owner' or user_role == 'admin' %}
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
                {% endif %}

            </form>
        </div>
    </div>
</div>
